# Deploy do backend no Cloud Run a cada push na master.
# As variáveis de ambiente do serviço (chaves, R2, Supabase, PROXY_SECRET) ficam no Cloud Run:
# o deploy sem --env-vars-file mantém as da revisão anterior. Nenhum segredo da API vai para o GitHub.
name: Deploy backend

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # login no Google sem chave (Workload Identity Federation)
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy no Cloud Run
        run: >-
          gcloud run deploy fachada-smart-api
          --source .
          --region us-central1
          --quiet
